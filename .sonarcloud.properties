# SonarCloud automatic analysis reads this file (there is no scanner step in CI).
#
# Migrations are left out of the duplication count only. A migration is frozen
# once it is applied (it is never edited, a change is the next file), and the
# domain migrations repeat the same convention on purpose: each domain table
# carries the same system columns, row-level security policies, merged view
# and grants as domains.speed_cameras, spelled out in full so a migration reads
# on its own. A duplication found there could not be removed, only moved.
# They are still analysed for bugs, vulnerabilities and smells.
sonar.cpd.exclusions=db/migrations/**
