# Weekly dependency updates, each as a pull request that runs the full CI.
# A version update waits 7 days after its release (cooldown), so a broken or
# malicious release has time to be found first; security updates are not delayed.
# Every pull request carries only the 'dependencies' label (the repo's label set
# is type:bug, type:feature, dependencies, documentation).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      dev-tooling:
        dependency-type: development
    # TypeScript's next major is not proposed until typescript-eslint accepts it
    # (its peer range is ">=4.8.4 <6.1.0"). Proposing it made npm re-resolve
    # typescript-eslint under the cooldown's date limit, which cannot find the
    # locked release when that is younger than seven days: ETARGET, and the
    # whole npm update job failed. Minor and patch updates still come.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    labels: [dependencies]
